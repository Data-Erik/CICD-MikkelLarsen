name: CI - CICD


on: 
    #workflow_dispatch: #er en mulighed for at man kan få lov til at få pipelinen til at virke.. er fin som debug metode.. 
    push:
        branches: ["master"] #det kan være en hvilken som helst branch, kører den by default på alle branches.

permission:
      contents: read

env:
    DOTNET_VERSION: "10.0.x"
    SOLUTION:PATH: "CICD-Template.slnx"

jobs:
    name: Build-and-Test
    runs-on: ubuntu-latest

    steps:
        - name: Get Code
          uses: actions/checkout@v7
        
        - name: Setup .NET
          uses: actions/setup-dotnet@v5
          with: 
            dotnet-version: ${{ env.DOTNET_VERSION }}

        - name: Restore
          run: dotnet restore ${{ env.SOLUTION_PATH }}

        - name: Build
          run: dotnet build ${{ env.SOLUTION_PATH}}
            --configuration Release
            --no-restore

        - name: Test
          run: dotnet test ${{ env. SOLUTION_PATH }}
            --configuration Release
            --no-restore
            --no-build
            --verbosity normal